server:
  servlet:
    context-path: /idispatch

vaadin:
  # The runboard WebSocket, and the mobile app and its API, are not Vaadin's
  exclude-urls: /ws/**, /api/**, /mobile/**
  frontend:
    hotdeploy: false
  allowed-packages: net.pkhapps, com.vaadin

spring:
  docker:
    compose:
      # Always run `docker compose up`, which starts whichever of PostgreSQL and Keycloak is missing (the default skips
      # it if any service is running). Leave both running when the app stops, so dev loop restarts don't wait for
      # Keycloak; `docker compose stop` in this directory stops them together.
      lifecycle-management: start-only
      start:
        skip: never
  security:
    oauth2:
      client:
        # Development defaults, matching the Keycloak realm that compose.yaml imports from keycloak/idispatch-realm.json.
        # Production overrides these in its own application.yml (see docs/keycloak.md).
        registration:
          keycloak:
            client-id: idispatch
            client-secret: idispatch-dev-secret
            scope: openid,profile
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/idispatch
            user-name-attribute: preferred_username

logging:
  level:
    net.pkhapps: debug
    org.springframework.security: debug
