server:
  servlet:
    context-path: /idispatch

vaadin:
  exclude-urls: /ws/**
  frontend:
    hotdeploy: false
  allowed-packages: net.pkhapps, com.vaadin

spring:
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the mappings match it.
      ddl-auto: validate

logging:
  level:
    net.pkhapps: debug
    org.springframework.security: debug
