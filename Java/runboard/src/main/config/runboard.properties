# Place this file in the working directory of the iDispatch Runboard application,
# or specify its location using the 'idispatch.configFile' system property.
# Relative paths in it, such as the voices, are relative to the working directory.

# The URL of the iDispatch runboard WebSocket endpoint: the server's host name, its context path (/idispatch) and
# /ws/runboard. Use wss:// when the server is behind HTTPS, and ws://localhost:8080/idispatch/ws/runboard for a
# server running on this machine.
idispatch.server.url=wss://idispatch.example.com/idispatch/ws/runboard

# The Runboard Key as entered into iDispatch Admin
idispatch.runboardKey=

# How often should the application ping the server to keep the connection alive? (in milliseconds)
# The connection is reopened if nothing has been heard from the server in three intervals.
idispatch.heartbeatInterval=10000

# Is the application running on a monitor with low resolution?
idispatch.lowres=false

# Will normal window decorations be hidden from the main window?
idispatch.undecorated=true

# Will the mouse cursor be hidden over the runboard? Set to true on a kiosk without a mouse, such as a Raspberry Pi,
# where the cursor otherwise stays in the middle of the screen.
idispatch.hideCursor=false

# How long each notification is shown on the screen, counted from when it was sent (in seconds). The flashing light
# is on for as long as a notification is shown.
idispatch.notification.shownFor=180

# How many times the alarm plays for new notifications that are not read out loud.
idispatch.alarm.plays=9

# How many times the alarm plays before new notifications are read out loud (at most idispatch.alarm.plays).
idispatch.alarm.playsBeforeSpeech=3

# The volume of the alarm and the error beep (in decibels, at most 0), compared with the speech. The speech is always
# made as loud as it can be without distorting, and the alarm is far louder than that at 0. Set the overall volume
# with the system mixer so that the speech is heard well, then adjust this if the alarm is too loud or quiet next to it.
idispatch.alarm.volume=-12

# How many times each notification is read out loud.
idispatch.speech.repeats=2

# The silence before each reading (in milliseconds).
idispatch.speech.pause=1000

# The speech engine that reads notifications out loud after the alarm, or 'none' to only play the alarm.
# Engines are plugged in through an SPI, see docs/speech.md. Each engine reads its own settings from
# idispatch.speech.<engine>.* properties.
idispatch.speech.engine=piper

# The language to read notifications in when the server doesn't send one, as servers from before
# idispatch.runboard.language don't. Leave empty to only play the alarm for such notifications.
#idispatch.speech.defaultLanguage=fi

# The driver that switches the amplifier (on while sound plays) and the flashing light (on while notifications are
# shown): 'none' to switch nothing, as on a desktop, or 'gpio' on a Raspberry Pi. See docs/outputs.md.
idispatch.output.driver=none

# How long to wait after switching the amplifier on before playing sound (in milliseconds).
idispatch.output.amplifierWarmUp=500

# GPIO: the line (on a Raspberry Pi, the GPIO number, not the header pin number) of each output, and whether it is low
# when on, as some relay boards need. An output without a line is not switched. The header's GPIOs are on gpiochip0
# on a Raspberry Pi 4 or 5.
#idispatch.output.gpio.chip=/dev/gpiochip0
#idispatch.output.gpio.amplifier.line=17
#idispatch.output.gpio.amplifier.activeLow=false
#idispatch.output.gpio.light.line=27
#idispatch.output.gpio.light.activeLow=false

# Piper: the voice for each language (ISO 639-1 code, as set on the server by idispatch.runboard.language). Each value
# is the path of a voice's .onnx file; its .onnx.json file must be next to it.
# Voices: https://huggingface.co/rhasspy/piper-voices. The download-voices script downloads these two. Without a voice
# for the notification's language, only the alarm is played.
idispatch.speech.piper.voice.fi=voices/fi_FI-harri-medium.onnx
idispatch.speech.piper.voice.sv=voices/sv_SE-nst-medium.onnx
