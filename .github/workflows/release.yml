# Creates a draft GitHub Release when a release tag is pushed (see Java/RELEASING.md):
#
# - idispatch-server/v<version>: the server is distributed as its sources at the tag, so the release only has notes.
# - idispatch-runboard/v<version>: the release carries the runboard's installation zip.
#
# The release stays a draft until someone fills in the notes and publishes it.
name: Release

on:
  push:
    tags:
      - 'idispatch-server/v*'
      - 'idispatch-runboard/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All tags, to find the component's previous release for the notes
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read the tag
        id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          component="${tag%%/v*}"
          version="${tag#*/v}"
          case "$component" in
            idispatch-server)   dir=Java/server;   title="iDispatch Server $version" ;;
            idispatch-runboard) dir=Java/runboard; title="iDispatch Runboard $version" ;;
            *) echo "::error::Unknown component in tag $tag"; exit 1 ;;
          esac
          pom_version=$(mvn -B -q -f "$dir/pom.xml" help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$pom_version" != "$version" ]; then
            echo "::error::Tag $tag does not match the version in $dir/pom.xml, $pom_version"
            exit 1
          fi
          previous=$(git tag --list "$component/v*" --sort=-v:refname | grep -vxF "$tag" | head -n 1 || true)
          {
            echo "component=$component"
            echo "version=$version"
            echo "dir=$dir"
            echo "title=$title"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B -f "${{ steps.tag.outputs.dir }}/pom.xml" -Passemble verify

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMPONENT: ${{ steps.tag.outputs.component }}
          VERSION: ${{ steps.tag.outputs.version }}
          TITLE: ${{ steps.tag.outputs.title }}
          PREVIOUS: ${{ steps.tag.outputs.previous }}
        run: |
          notes=$(mktemp)
          if [ "$COMPONENT" = idispatch-server ]; then
            assets=()
            latest=false
            cat > "$notes" <<EOF
          **Works with runboard versions:** _fill in_

          ## Installing and upgrading

          The server is built from its sources at this release's tag. In your checkout of the repository:

          \`\`\`shell
          git fetch --tags
          git checkout $TAG
          cd Java/server/deploy
          docker compose up -d --build
          \`\`\`

          The database is migrated when the server starts. See [deployment.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/Java/server/docs/deployment.md).

          ## Changes

          _Summarise the server's changes; the list below covers the whole repository._
          EOF
          else
            assets=("Java/runboard/target/iDispatchRunboard-$VERSION.zip")
            latest=true
            cat > "$notes" <<EOF
          **Works with server versions:** _fill in_

          ## Installing and upgrading

          Download **iDispatchRunboard-$VERSION.zip** below and unzip it. To upgrade, unzip it over the old installation:
          runboard.properties and the downloaded voices are kept. Requires Java 25 or later; see README.txt in the zip.

          ## Changes

          _Summarise the runboard's changes; the list below covers the whole repository._
          EOF
          fi
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" "${assets[@]}" \
            --draft \
            --verify-tag \
            --title "$TITLE" \
            --notes-file "$notes" \
            --generate-notes "${start[@]}" \
            --latest="$latest"
