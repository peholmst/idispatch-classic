# Builds and tests the server and the runboard, and builds the runboard's zip, on every pull request and on main.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The server's tests start PostgreSQL with Testcontainers, on the runner's Docker.
      - name: Build and test
        run: mvn -B -Passemble verify
      - uses: actions/upload-artifact@v4
        with:
          name: runboard-zip
          path: Java/runboard/target/iDispatchRunboard-*.zip
          if-no-files-found: error
